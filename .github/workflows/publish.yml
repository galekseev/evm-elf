name: Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write # OIDC token for npm trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false # a release must not build from a cache

      - name: Check the tag against the package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p 'require("./package.json").version')"
          if [ "$tag" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match version $version in package.json" >&2
            exit 1
          fi

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      # Authorized by the trusted publisher configured for the package on
      # npmjs.com, which also makes npm attach a provenance attestation.
      - run: npm publish
